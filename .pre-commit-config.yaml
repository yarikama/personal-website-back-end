# The project's own ruff (uv.lock), the one CI runs: a separately pinned
# hook drifted to a version that did not know the configured rules.
# --force-exclude: pyproject's exclude also covers the files pre-commit
# names, or a commit touching app/alembic/env.py has its model imports
# removed as unused (autogenerate needs them).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
