  <text class="t" x="252" y="726">Actions CI</text>
  <text class="s" x="252" y="742">lint · test · build</text>
  <text class="s" x="252" y="756">image → GHCR</text>
  <rect class="card" x="336" y="704" width="120" height="60" rx="10"/>
  <text class="t" x="396" y="726">homelab</text>
  <text class="s" x="396" y="742">private repo</text>
  <text class="s" x="396" y="756">manifests · tags</text>

