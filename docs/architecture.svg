  <path class="e req" d="M780 345 V272" marker-end="url(#a-req)"/>
  <text class="lbl" x="780" y="318">chat</text>
  <path class="e req" d="M870 345 V290 H1091 V272" marker-end="url(#a-req)"/>
  <text class="lbl" x="990" y="294">completions</text>
