  <rect class="ns" x="32" y="670" width="432" height="110" rx="12"/>
  <text class="h" x="48" y="692">GitHub</text>
  <text class="hm" x="100" y="692">· merging to main is the deploy</text>
  <rect class="card" x="48" y="704" width="120" height="60" rx="10"/>
  <text class="t" x="108" y="726">This repo</text>
  <text class="s" x="108" y="742">back-end</text>
