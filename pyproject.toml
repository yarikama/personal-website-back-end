[project]
requires-python = ">=3.10"
name = "personal-website-back-end"
version = "0.1.0"
description = "Yarikama's personal website: projects, notes and a chat about them"
authors = [
    { name = "yarikama", email = "hsuhengjui@gmail.com" },
]
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.31.1",
    "pydantic[email]>=2.0.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    # Below 2.1 until opentelemetry-instrumentation-sqlalchemy supports it
    # (its package.py: "sqlalchemy >= 1.0.0, < 2.1.0"); on 2.1 it skips
    # instrumenting, and queries stop being traced without a word.
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "alembic>=1.13.0",
    "pyjwt>=2.10",
    "aioboto3>=12.0.0",
    "python-multipart>=0.0.31",
    "redis>=6",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.62b1",
    "opentelemetry-instrumentation-redis>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.2",
    "mcp>=2.3",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "ruff>=0.14",
    "pre-commit>=3.5.0",
    "ipdb>=0.13.0",
    "fakeredis[lua]>=2.30",
    "httpx2>=2.13",
    "pyright>=1.1.414",
    "pytest-cov>=6",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "__pycache__", ".git", "alembic"]
# The app runs with PYTHONPATH=app: api, core, db, ... are first-party.
src = ["app"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # blocking calls inside async functions
    "FAST",   # FastAPI: Annotated dependencies, no redundant response_model
    "DTZ",    # datetimes without a time zone
    "C4",     # comprehensions
    "PIE",    # unnecessary pass, placeholders, duplicate keys
    "RET",    # return statements
    "PERF",   # performance anti-patterns
    "RUF",    # ruff's own
]
ignore = [
    "RUF001", # full-width punctuation in strings: Chinese text, on purpose
    "RUF003", # and in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

# `make coverage`, and CI: pytest --cov.
[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]
branch = true
# SQLAlchemy's asyncio runs each query in a greenlet. Without "greenlet",
# coverage loses track of every line after an await and reports them unrun
# (85% instead of 91% when this was added).
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI fails below this: raise it as tests are added, never lower it.
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.pyright]
# Also what Pylance uses in the editor: a pyproject [tool.pyright] overrides
# the editor's own python.analysis settings. CI runs `uv run pyright`.
include = ["app", "tests"]
exclude = ["app/alembic", "**/__pycache__"]
extraPaths = ["app"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
# Beyond "standard": a bare dict or list says nothing of what it holds, and a
# type: ignore that no longer silences anything hides the next real error.
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"
