name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Lint
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ruff format --check .
      # Settings in pyproject.toml [tool.pyright], the same Pylance uses.
      - name: Type check
        run: uv run pyright

  # Known vulnerabilities in the locked dependencies. Not a prerequisite of
  # the image: a new advisory shows up here without blocking deploys.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: pip-audit
        run: |
          uv export --locked --no-emit-project --no-hashes -o requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --no-deps

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The rate-limit tests run their Lua scripts here as well as in
      # fakeredis, so a difference between the two cannot hide a bug.
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Test
        # Fails below [tool.coverage.report] fail_under in pyproject.toml.
        run: uv run pytest -v --cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_TEST_URL: redis://localhost:6379/15

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/website-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Points the homelab repo at the image just pushed. Argo CD watches that
  # repo and rolls the new image out within a few minutes.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # HOMELAB_DEPLOY_KEY is an environment secret, and the production
    # environment only admits main, so workflows on other branches or from
    # pull requests cannot read it.
    environment: production
    # Two quick merges must not race each other's push to homelab.
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yarikama/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}

      - name: Set the image tag
        env:
          # Matches the sha tag docker/metadata-action gave the image.
          TAG: sha-${{ github.sha }}
        run: |
          TAG=${TAG:0:11}
          file=apps/website-backend/kustomization.yaml
          sed -i -E "s/^(    newTag: ).*/\1${TAG}/" "$file"
          grep -q "^    newTag: ${TAG}$" "$file"

          if git diff --quiet; then
            echo "Already on ${TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(website-backend): ${TAG}" \
            -m "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          # Someone may have pushed to homelab since the checkout.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
